name: "Respaldo · Base de datos y archivos"

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      incluir_archivos:
        description: "Respaldar también los archivos de Supabase Storage"
        type: boolean
        default: false

concurrency:
  group: respaldo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preparar:
    name: Preparar el punto de recuperación
    runs-on: ubuntu-24.04
    outputs:
      recovery_point_id: ${{ steps.plan.outputs.recovery_point_id }}
      retention_policy: ${{ steps.plan.outputs.retention_policy }}
      started_at: ${{ steps.plan.outputs.started_at }}
    steps:
      - name: Generar identificador y política
        id: plan
        shell: bash
        run: |
          recovery_point_id="$(cat /proc/sys/kernel/random/uuid)"
          if [ "$(date -u +%d)" = "01" ]; then
            retention_policy="p03"
          elif [ "$(date -u +%u)" = "7" ]; then
            retention_policy="p02"
          else
            retention_policy="p01"
          fi
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "recovery_point_id=$recovery_point_id" >> "$GITHUB_OUTPUT"
          echo "retention_policy=$retention_policy" >> "$GITHUB_OUTPUT"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Registrar el inicio para monitoreo
        continue-on-error: true
        env:
          BACKUP_REPORT_URL: ${{ vars.BACKUP_REPORT_URL }}
          BACKUP_REPORT_TOKEN: ${{ secrets.BACKUP_REPORT_TOKEN }}
          RECOVERY_POINT_ID: ${{ steps.plan.outputs.recovery_point_id }}
          RETENTION_POLICY: ${{ steps.plan.outputs.retention_policy }}
          STARTED_AT: ${{ steps.plan.outputs.started_at }}
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$BACKUP_REPORT_URL" ] || [ -z "$BACKUP_REPORT_TOKEN" ]; then
            echo "Monitoreo interno no configurado; el respaldo continuará."
            exit 0
          fi
          payload="$(jq -n \
            --arg runId "${{ github.run_id }}" \
            --argjson runAttempt "${{ github.run_attempt }}" \
            --arg recoveryPointId "$RECOVERY_POINT_ID" \
            --arg retentionPolicy "$RETENTION_POLICY" \
            --arg triggerType "$TRIGGER_TYPE" \
            --arg startedAt "$STARTED_AT" \
            --arg commitSha "${{ github.sha }}" \
            --arg workflowUrl "$WORKFLOW_URL" \
            '{runId:$runId,runAttempt:$runAttempt,recoveryPointId:$recoveryPointId,
              retentionPolicy:$retentionPolicy,triggerType:$triggerType,phase:"STARTED",
              status:"IN_PROGRESS",databaseStatus:"PENDING",restrictionsStatus:"PENDING",
              storageStatus:"PENDING",startedAt:$startedAt,finishedAt:null,
              commitSha:$commitSha,workflowUrl:$workflowUrl}')"
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -H "X-Backup-Report-Token: $BACKUP_REPORT_TOKEN" \
            --data "$payload" "$BACKUP_REPORT_URL/internal/backups/events"

  base-de-datos:
    name: Respaldar la base de datos
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: preparar
    env:
      SUPABASE_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_ALLOWED_CIDRS_BASE: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS_BASE }}
      SUPABASE_DB_ALLOWED_CIDRS_V6_BASE: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS_V6_BASE || '[]' }}

    services:
      verificacion:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verificacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar el cliente de PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common jq
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verificar el cliente de PostgreSQL
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "17"

      - name: Autorizar temporalmente la IP del runner en Supabase
        run: bash ops/backup/acceso-temporal-supabase.sh autorizar

      - name: Instalar rclone (solo si el destino es Google Drive)
        if: vars.BACKUP_DESTINO == 'drive'
        run: sudo apt-get install -y -qq rclone

      - name: Respaldar, verificar, cifrar y subir
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          VERIFY_DB_URL: postgresql://postgres:verificacion@localhost:5432/postgres
          GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
          GPG_EXPECTED_FINGERPRINT: ${{ secrets.BACKUP_GPG_EXPECTED_FINGERPRINT }}
          GPG_SIGNING_PRIVATE_KEY: ${{ secrets.BACKUP_GPG_SIGNING_PRIVATE_KEY }}
          GPG_EXPECTED_SIGNING_FINGERPRINT: ${{ secrets.BACKUP_GPG_SIGNING_FINGERPRINT }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.BACKUP_GPG_SIGNING_PASSPHRASE }}
          BACKUP_RECOVERY_POINT_ID: ${{ needs.preparar.outputs.recovery_point_id }}
          BACKUP_RETENTION_POLICY: ${{ needs.preparar.outputs.retention_policy }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_BASE_URL }}
          BACKUP_DESTINO: ${{ vars.BACKUP_DESTINO || 's3' }}
          RCLONE_CONFIG_RESPALDO_TYPE: drive
          RCLONE_CONFIG_RESPALDO_SCOPE: drive.file
          RCLONE_CONFIG_RESPALDO_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: bash ops/backup/respaldar-base.sh

  restaurar-restricciones:
    name: Cerrar el acceso temporal a la base
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: base-de-datos
    if: ${{ always() }}
    env:
      SUPABASE_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_ALLOWED_CIDRS_BASE: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS_BASE }}
      SUPABASE_DB_ALLOWED_CIDRS_V6_BASE: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS_V6_BASE || '[]' }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar dependencia JSON
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Restaurar las restricciones permanentes de Supabase
        run: bash ops/backup/acceso-temporal-supabase.sh restaurar

  archivos:
    name: Respaldar los archivos
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [preparar, base-de-datos, restaurar-restricciones]
    if: >-
      needs.base-de-datos.result == 'success' &&
      needs.restaurar-restricciones.result == 'success' &&
      (github.event_name == 'schedule' || inputs.incluir_archivos == true)

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar rclone (solo si el destino es Google Drive)
        if: vars.BACKUP_DESTINO == 'drive'
        run: sudo apt-get install -y -qq rclone

      - name: Respaldar, cifrar y subir los archivos
        env:
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          SUPABASE_S3_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_BUCKETS: ${{ secrets.SUPABASE_BUCKETS }}
          GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
          GPG_EXPECTED_FINGERPRINT: ${{ secrets.BACKUP_GPG_EXPECTED_FINGERPRINT }}
          GPG_SIGNING_PRIVATE_KEY: ${{ secrets.BACKUP_GPG_SIGNING_PRIVATE_KEY }}
          GPG_EXPECTED_SIGNING_FINGERPRINT: ${{ secrets.BACKUP_GPG_SIGNING_FINGERPRINT }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.BACKUP_GPG_SIGNING_PASSPHRASE }}
          BACKUP_RECOVERY_POINT_ID: ${{ needs.preparar.outputs.recovery_point_id }}
          BACKUP_RETENTION_POLICY: ${{ needs.preparar.outputs.retention_policy }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          HEALTHCHECK_ARCHIVOS_URL: ${{ secrets.HEALTHCHECK_ARCHIVOS_URL }}
          BACKUP_DESTINO: ${{ vars.BACKUP_DESTINO || 's3' }}
          RCLONE_CONFIG_RESPALDO_TYPE: drive
          RCLONE_CONFIG_RESPALDO_SCOPE: drive.file
          RCLONE_CONFIG_RESPALDO_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: bash ops/backup/respaldar-archivos.sh

  registrar-resultado:
    name: Registrar el resultado operativo
    runs-on: ubuntu-24.04
    needs: [preparar, base-de-datos, restaurar-restricciones, archivos]
    if: ${{ always() && needs.preparar.result == 'success' }}
    steps:
      - name: Publicar resumen sanitizado
        continue-on-error: true
        env:
          BACKUP_REPORT_URL: ${{ vars.BACKUP_REPORT_URL }}
          BACKUP_REPORT_TOKEN: ${{ secrets.BACKUP_REPORT_TOKEN }}
          RECOVERY_POINT_ID: ${{ needs.preparar.outputs.recovery_point_id }}
          RETENTION_POLICY: ${{ needs.preparar.outputs.retention_policy }}
          STARTED_AT: ${{ needs.preparar.outputs.started_at }}
          DATABASE_RESULT: ${{ needs.base-de-datos.result }}
          RESTRICTIONS_RESULT: ${{ needs.restaurar-restricciones.result }}
          STORAGE_RESULT: ${{ needs.archivos.result }}
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$BACKUP_REPORT_URL" ] || [ -z "$BACKUP_REPORT_TOKEN" ]; then
            echo "Monitoreo interno no configurado; el resultado permanece en GitHub Actions."
            exit 0
          fi

          component_status() {
            case "$1" in
              success) echo "SUCCESS" ;;
              skipped) echo "SKIPPED" ;;
              *) echo "FAILED" ;;
            esac
          }

          database_status="$(component_status "$DATABASE_RESULT")"
          restrictions_status="$(component_status "$RESTRICTIONS_RESULT")"
          storage_status="$(component_status "$STORAGE_RESULT")"
          if [ "$database_status" != "SUCCESS" ] || [ "$restrictions_status" != "SUCCESS" ] || [ "$storage_status" = "FAILED" ]; then
            overall_status="FAILED"
          elif [ "$storage_status" = "SKIPPED" ]; then
            overall_status="PARTIAL"
          else
            overall_status="SUCCESS"
          fi
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          payload="$(jq -n \
            --arg runId "${{ github.run_id }}" \
            --argjson runAttempt "${{ github.run_attempt }}" \
            --arg recoveryPointId "$RECOVERY_POINT_ID" \
            --arg retentionPolicy "$RETENTION_POLICY" \
            --arg triggerType "$TRIGGER_TYPE" \
            --arg status "$overall_status" \
            --arg databaseStatus "$database_status" \
            --arg restrictionsStatus "$restrictions_status" \
            --arg storageStatus "$storage_status" \
            --arg startedAt "$STARTED_AT" \
            --arg finishedAt "$finished_at" \
            --arg commitSha "${{ github.sha }}" \
            --arg workflowUrl "$WORKFLOW_URL" \
            '{runId:$runId,runAttempt:$runAttempt,recoveryPointId:$recoveryPointId,
              retentionPolicy:$retentionPolicy,triggerType:$triggerType,phase:"COMPLETED",
              status:$status,databaseStatus:$databaseStatus,restrictionsStatus:$restrictionsStatus,
              storageStatus:$storageStatus,startedAt:$startedAt,finishedAt:$finishedAt,
              commitSha:$commitSha,workflowUrl:$workflowUrl}')"
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -H "X-Backup-Report-Token: $BACKUP_REPORT_TOKEN" \
            --data "$payload" "$BACKUP_REPORT_URL/internal/backups/events"
