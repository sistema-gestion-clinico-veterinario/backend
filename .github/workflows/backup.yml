name: "Respaldo · Base de datos, logs y archivos"

on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "17 15 * * *"
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      incluir_archivos:
        description: "Respaldar también los archivos de Supabase Storage"
        type: boolean
        default: false

concurrency:
  group: respaldo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preparar:
    name: Preparar el punto de recuperación
    runs-on: ubuntu-24.04
    outputs:
      recovery_point_id: ${{ steps.plan.outputs.recovery_point_id }}
      retention_policy: ${{ steps.plan.outputs.retention_policy }}
      started_at: ${{ steps.plan.outputs.started_at }}
    steps:
      - name: Generar identificador y política
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          recovery_point_id="$(cat /proc/sys/kernel/random/uuid)"
          retention_policy="p01"
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "17 7 * * *" ]; then
            if [ "$(date -u +%d)" = "01" ]; then
              retention_policy="p03"
            elif [ "$(date -u +%u)" = "7" ]; then
              retention_policy="p02"
            fi
          fi
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "recovery_point_id=$recovery_point_id" >> "$GITHUB_OUTPUT"
          echo "retention_policy=$retention_policy" >> "$GITHUB_OUTPUT"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Registrar el inicio para monitoreo
        continue-on-error: true
        env:
          BACKUP_REPORT_URL: ${{ vars.BACKUP_REPORT_URL }}
          BACKUP_REPORT_TOKEN: ${{ secrets.BACKUP_REPORT_TOKEN }}
          RECOVERY_POINT_ID: ${{ steps.plan.outputs.recovery_point_id }}
          RETENTION_POLICY: ${{ steps.plan.outputs.retention_policy }}
          STARTED_AT: ${{ steps.plan.outputs.started_at }}
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$BACKUP_REPORT_URL" ] || [ -z "$BACKUP_REPORT_TOKEN" ]; then
            echo "Monitoreo interno no configurado; el respaldo continuará."
            exit 0
          fi
          payload="$(jq -n \
            --arg runId "${{ github.run_id }}" \
            --argjson runAttempt "${{ github.run_attempt }}" \
            --arg recoveryPointId "$RECOVERY_POINT_ID" \
            --arg retentionPolicy "$RETENTION_POLICY" \
            --arg triggerType "$TRIGGER_TYPE" \
            --arg startedAt "$STARTED_AT" \
            --arg commitSha "${{ github.sha }}" \
            --arg workflowUrl "$WORKFLOW_URL" \
            '{runId:$runId,runAttempt:$runAttempt,recoveryPointId:$recoveryPointId,
              retentionPolicy:$retentionPolicy,triggerType:$triggerType,phase:"STARTED",
              status:"IN_PROGRESS",databaseStatus:"PENDING",restrictionsStatus:"PENDING",
              storageStatus:"PENDING",recoveryStatus:"PENDING",startedAt:$startedAt,finishedAt:null,
              integralRecoveryVerified:false,integralRecoveryDurationSeconds:null,
              commitSha:$commitSha,workflowUrl:$workflowUrl}')"
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -H "X-Backup-Report-Token: $BACKUP_REPORT_TOKEN" \
            --data "$payload" "$BACKUP_REPORT_URL/internal/backups/events"

  base-de-datos:
    name: Respaldar la base de datos
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: preparar
    outputs:
      protected_size_bytes: ${{ steps.database_backup.outputs.protected_size_bytes }}
      database_restore_verified: ${{ steps.database_backup.outputs.database_restore_verified }}
      database_restore_duration_seconds: ${{ steps.database_backup.outputs.database_restore_duration_seconds }}
      logs_protected_size_bytes: ${{ steps.database_backup.outputs.logs_protected_size_bytes }}
      protected_log_count: ${{ steps.database_backup.outputs.protected_log_count }}
    env:
      SUPABASE_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_ALLOWED_CIDRS_BASE: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS_BASE }}
      SUPABASE_DB_ALLOWED_CIDRS_V6_BASE: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS_V6_BASE || '[]' }}

    services:
      verificacion:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verificacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar el cliente de PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common jq
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verificar el cliente de PostgreSQL
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "17"

      - name: Autorizar temporalmente la IP del runner en Supabase
        run: bash ops/backup/acceso-temporal-supabase.sh autorizar

      - name: Instalar rclone (solo si el destino es Google Drive)
        if: vars.BACKUP_DESTINO == 'drive'
        run: sudo apt-get install -y -qq rclone

      - name: Respaldar, verificar, cifrar y subir
        id: database_backup
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          VERIFY_DB_URL: postgresql://postgres:verificacion@localhost:5432/postgres
          GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
          GPG_EXPECTED_FINGERPRINT: ${{ secrets.BACKUP_GPG_EXPECTED_FINGERPRINT }}
          GPG_SIGNING_PRIVATE_KEY: ${{ secrets.BACKUP_GPG_SIGNING_PRIVATE_KEY }}
          GPG_EXPECTED_SIGNING_FINGERPRINT: ${{ secrets.BACKUP_GPG_SIGNING_FINGERPRINT }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.BACKUP_GPG_SIGNING_PASSPHRASE }}
          BACKUP_RECOVERY_POINT_ID: ${{ needs.preparar.outputs.recovery_point_id }}
          BACKUP_RETENTION_POLICY: ${{ needs.preparar.outputs.retention_policy }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_BASE_URL }}
          BACKUP_DESTINO: ${{ vars.BACKUP_DESTINO || 's3' }}
          RCLONE_CONFIG_RESPALDO_TYPE: drive
          RCLONE_CONFIG_RESPALDO_SCOPE: drive.file
          RCLONE_CONFIG_RESPALDO_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          bash ops/backup/respaldar-base.sh
          bash ops/backup/respaldar-logs.sh

  restaurar-restricciones:
    name: Cerrar el acceso temporal a la base
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: base-de-datos
    if: ${{ always() }}
    env:
      SUPABASE_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_ALLOWED_CIDRS_BASE: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS_BASE }}
      SUPABASE_DB_ALLOWED_CIDRS_V6_BASE: ${{ vars.SUPABASE_DB_ALLOWED_CIDRS_V6_BASE || '[]' }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar dependencia JSON
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Restaurar las restricciones permanentes de Supabase
        run: bash ops/backup/acceso-temporal-supabase.sh restaurar

  archivos:
    name: Respaldar los archivos
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [preparar, base-de-datos, restaurar-restricciones]
    if: >-
      needs.base-de-datos.result == 'success' &&
      needs.restaurar-restricciones.result == 'success' &&
      (github.event_name == 'schedule' || inputs.incluir_archivos == true)
    outputs:
      protected_size_bytes: ${{ steps.storage_backup.outputs.protected_size_bytes }}
      protected_file_count: ${{ steps.storage_backup.outputs.protected_file_count }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar rclone (solo si el destino es Google Drive)
        if: vars.BACKUP_DESTINO == 'drive'
        run: sudo apt-get install -y -qq rclone

      - name: Respaldar, cifrar y subir los archivos
        id: storage_backup
        env:
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          SUPABASE_S3_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_BUCKETS: ${{ secrets.SUPABASE_BUCKETS }}
          GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
          GPG_EXPECTED_FINGERPRINT: ${{ secrets.BACKUP_GPG_EXPECTED_FINGERPRINT }}
          GPG_SIGNING_PRIVATE_KEY: ${{ secrets.BACKUP_GPG_SIGNING_PRIVATE_KEY }}
          GPG_EXPECTED_SIGNING_FINGERPRINT: ${{ secrets.BACKUP_GPG_SIGNING_FINGERPRINT }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.BACKUP_GPG_SIGNING_PASSPHRASE }}
          BACKUP_RECOVERY_POINT_ID: ${{ needs.preparar.outputs.recovery_point_id }}
          BACKUP_RETENTION_POLICY: ${{ needs.preparar.outputs.retention_policy }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: '10'
          BACKUP_STORAGE_MAX_ATTEMPTS: '4'
          BACKUP_STORAGE_RETRY_DELAY_SECONDS: '15'
          BACKUP_STORAGE_CONNECT_TIMEOUT_SECONDS: '30'
          BACKUP_STORAGE_READ_TIMEOUT_SECONDS: '120'
          HEALTHCHECK_ARCHIVOS_URL: ${{ secrets.HEALTHCHECK_ARCHIVOS_URL }}
          BACKUP_DESTINO: ${{ vars.BACKUP_DESTINO || 's3' }}
          RCLONE_CONFIG_RESPALDO_TYPE: drive
          RCLONE_CONFIG_RESPALDO_SCOPE: drive.file
          RCLONE_CONFIG_RESPALDO_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: bash ops/backup/respaldar-archivos.sh

  recuperacion-integral:
    name: Probar recuperación integral desde el repositorio
    runs-on: ubuntu-24.04
    environment: backup-recovery
    timeout-minutes: 120
    needs: [preparar, archivos]
    if: >-
      needs.archivos.result == 'success' &&
      vars.BACKUP_ENABLE_INTEGRAL_RECOVERY_TEST == 'true'
    outputs:
      integral_recovery_verified: ${{ steps.recovery_test.outputs.integral_recovery_verified }}
      integral_recovery_duration_seconds: ${{ steps.recovery_test.outputs.integral_recovery_duration_seconds }}

    services:
      recuperacion:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: recuperacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar herramientas de recuperación
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common jq
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Instalar rclone (solo si el destino es Google Drive)
        if: vars.BACKUP_DESTINO == 'drive'
        run: sudo apt-get install -y -qq rclone

      - name: Descargar, descifrar y restaurar el punto publicado
        id: recovery_test
        env:
          VERIFY_DB_URL: postgresql://postgres:recuperacion@localhost:5432/postgres
          BACKUP_RECOVERY_POINT_ID: ${{ needs.preparar.outputs.recovery_point_id }}
          BACKUP_RETENTION_POLICY: ${{ needs.preparar.outputs.retention_policy }}
          GPG_DECRYPTION_PRIVATE_KEY: ${{ secrets.BACKUP_GPG_PRIVATE_KEY }}
          GPG_DECRYPTION_PASSPHRASE: ${{ secrets.BACKUP_GPG_PRIVATE_KEY_PASSPHRASE }}
          GPG_EXPECTED_FINGERPRINT: ${{ secrets.BACKUP_GPG_EXPECTED_FINGERPRINT }}
          GPG_SIGNING_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_SIGNING_PUBLIC_KEY }}
          GPG_EXPECTED_SIGNING_FINGERPRINT: ${{ secrets.BACKUP_GPG_SIGNING_FINGERPRINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BACKUP_DESTINO: ${{ vars.BACKUP_DESTINO || 's3' }}
          RCLONE_CONFIG_RESPALDO_TYPE: drive
          RCLONE_CONFIG_RESPALDO_SCOPE: drive.file
          RCLONE_CONFIG_RESPALDO_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: bash ops/backup/probar-recuperacion-integral.sh

  registrar-resultado:
    name: Registrar el resultado operativo
    runs-on: ubuntu-24.04
    needs: [preparar, base-de-datos, restaurar-restricciones, archivos, recuperacion-integral]
    if: ${{ always() && needs.preparar.result == 'success' }}
    steps:
      - name: Publicar resumen sanitizado
        continue-on-error: true
        env:
          BACKUP_REPORT_URL: ${{ vars.BACKUP_REPORT_URL }}
          BACKUP_REPORT_TOKEN: ${{ secrets.BACKUP_REPORT_TOKEN }}
          RECOVERY_POINT_ID: ${{ needs.preparar.outputs.recovery_point_id }}
          RETENTION_POLICY: ${{ needs.preparar.outputs.retention_policy }}
          STARTED_AT: ${{ needs.preparar.outputs.started_at }}
          DATABASE_RESULT: ${{ needs.base-de-datos.result }}
          RESTRICTIONS_RESULT: ${{ needs.restaurar-restricciones.result }}
          STORAGE_RESULT: ${{ needs.archivos.result }}
          RECOVERY_RESULT: ${{ needs.recuperacion-integral.result }}
          DATABASE_SIZE_BYTES: ${{ needs.base-de-datos.outputs.protected_size_bytes }}
          LOGS_SIZE_BYTES: ${{ needs.base-de-datos.outputs.logs_protected_size_bytes }}
          STORAGE_SIZE_BYTES: ${{ needs.archivos.outputs.protected_size_bytes }}
          PROTECTED_FILE_COUNT: ${{ needs.archivos.outputs.protected_file_count }}
          DATABASE_RESTORE_VERIFIED: ${{ needs.base-de-datos.outputs.database_restore_verified }}
          DATABASE_RESTORE_DURATION_SECONDS: ${{ needs.base-de-datos.outputs.database_restore_duration_seconds }}
          INTEGRAL_RECOVERY_VERIFIED: ${{ needs.recuperacion-integral.outputs.integral_recovery_verified }}
          INTEGRAL_RECOVERY_DURATION_SECONDS: ${{ needs.recuperacion-integral.outputs.integral_recovery_duration_seconds }}
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$BACKUP_REPORT_URL" ] || [ -z "$BACKUP_REPORT_TOKEN" ]; then
            echo "Monitoreo interno no configurado; el resultado permanece en GitHub Actions."
            exit 0
          fi

          component_status() {
            case "$1" in
              success) echo "SUCCESS" ;;
              skipped) echo "SKIPPED" ;;
              *) echo "FAILED" ;;
            esac
          }

          database_status="$(component_status "$DATABASE_RESULT")"
          restrictions_status="$(component_status "$RESTRICTIONS_RESULT")"
          storage_status="$(component_status "$STORAGE_RESULT")"
          recovery_status="$(component_status "$RECOVERY_RESULT")"
          if [ "$database_status" != "SUCCESS" ] || [ "$restrictions_status" != "SUCCESS" ] || [ "$storage_status" = "FAILED" ] || [ "$recovery_status" = "FAILED" ]; then
            overall_status="FAILED"
          elif [ "$storage_status" = "SKIPPED" ]; then
            overall_status="PARTIAL"
          else
            overall_status="SUCCESS"
          fi
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          numeric_or_zero() {
            printf '%s' "$1" | grep -Eq '^[0-9]+$' && printf '%s' "$1" || printf '0'
          }
          database_size_bytes="$(numeric_or_zero "$DATABASE_SIZE_BYTES")"
          logs_size_bytes="$(numeric_or_zero "$LOGS_SIZE_BYTES")"
          storage_size_bytes="$(numeric_or_zero "$STORAGE_SIZE_BYTES")"
          protected_size_bytes="$((database_size_bytes + logs_size_bytes + storage_size_bytes))"
          protected_file_count="$(numeric_or_zero "$PROTECTED_FILE_COUNT")"
          database_restore_duration_seconds="$(numeric_or_zero "$DATABASE_RESTORE_DURATION_SECONDS")"
          [ "$DATABASE_RESTORE_VERIFIED" = "true" ] || DATABASE_RESTORE_VERIFIED="false"
          [ "$INTEGRAL_RECOVERY_VERIFIED" = "true" ] || INTEGRAL_RECOVERY_VERIFIED="false"
          if [ "$INTEGRAL_RECOVERY_VERIFIED" = "true" ]; then
            integral_recovery_duration_seconds="$(numeric_or_zero "$INTEGRAL_RECOVERY_DURATION_SECONDS")"
          else
            integral_recovery_duration_seconds="null"
          fi
          if [ "$storage_status" = "SUCCESS" ]; then
            compression_algorithm="PostgreSQL custom nivel 9 y gzip (archivos y logs)"
          else
            compression_algorithm="PostgreSQL custom nivel 9 y gzip (logs)"
          fi

          payload="$(jq -n \
            --arg runId "${{ github.run_id }}" \
            --argjson runAttempt "${{ github.run_attempt }}" \
            --arg recoveryPointId "$RECOVERY_POINT_ID" \
            --arg retentionPolicy "$RETENTION_POLICY" \
            --arg triggerType "$TRIGGER_TYPE" \
            --arg status "$overall_status" \
            --arg databaseStatus "$database_status" \
            --arg restrictionsStatus "$restrictions_status" \
            --arg storageStatus "$storage_status" \
            --arg recoveryStatus "$recovery_status" \
            --arg startedAt "$STARTED_AT" \
            --arg finishedAt "$finished_at" \
            --arg commitSha "${{ github.sha }}" \
            --arg workflowUrl "$WORKFLOW_URL" \
            --argjson protectedSizeBytes "$protected_size_bytes" \
            --argjson protectedFileCount "$protected_file_count" \
            --arg compressionAlgorithm "$compression_algorithm" \
            --arg encryptionAlgorithm "OpenPGP" \
            --argjson databaseRestoreVerified "$DATABASE_RESTORE_VERIFIED" \
            --argjson databaseRestoreDurationSeconds "$database_restore_duration_seconds" \
            --argjson integralRecoveryVerified "$INTEGRAL_RECOVERY_VERIFIED" \
            --argjson integralRecoveryDurationSeconds "$integral_recovery_duration_seconds" \
            '{runId:$runId,runAttempt:$runAttempt,recoveryPointId:$recoveryPointId,
              retentionPolicy:$retentionPolicy,triggerType:$triggerType,phase:"COMPLETED",
              status:$status,databaseStatus:$databaseStatus,restrictionsStatus:$restrictionsStatus,
              storageStatus:$storageStatus,recoveryStatus:$recoveryStatus,
              startedAt:$startedAt,finishedAt:$finishedAt,
              commitSha:$commitSha,workflowUrl:$workflowUrl,protectedSizeBytes:$protectedSizeBytes,
              protectedFileCount:$protectedFileCount,compressionAlgorithm:$compressionAlgorithm,
              encryptionAlgorithm:$encryptionAlgorithm,databaseRestoreVerified:$databaseRestoreVerified,
              databaseRestoreDurationSeconds:$databaseRestoreDurationSeconds,
              integralRecoveryVerified:$integralRecoveryVerified,
              integralRecoveryDurationSeconds:$integralRecoveryDurationSeconds}')"
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -H "X-Backup-Report-Token: $BACKUP_REPORT_TOKEN" \
            --data "$payload" "$BACKUP_REPORT_URL/internal/backups/events"
