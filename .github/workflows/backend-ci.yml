name: "Backend · Pruebas y compilación"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verificar backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Base desechable para las pruebas de migraciones (FlywayConEsquemaExistenteTest): se crea y se destruye
    # con el trabajo, no contiene datos y no es accesible desde fuera de este ejecutor.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prueba-ci
          POSTGRES_DB: prueba_flyway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prueba_flyway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Ejecutar pruebas y generar JAR
        env:
          FLYWAY_TEST_URL: jdbc:postgresql://localhost:5432/prueba_flyway
          FLYWAY_TEST_USER: postgres
          FLYWAY_TEST_PASSWORD: prueba-ci
        run: mvn --batch-mode --no-transfer-progress clean verify

  backup-recovery:
    name: Verificar respaldo y recuperación
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar PostgreSQL 17 y utilidades
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common jq gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-17 postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Validar sintaxis de los scripts
        shell: bash
        run: bash -n ops/backup/*.sh

      - name: Ejecutar prueba integral aislada
        shell: bash
        run: bash ops/backup/prueba-local.sh
