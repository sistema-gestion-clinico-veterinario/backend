name: "Fase 3d: panel optimizado (laboratorio)"

on:
  push:
    branches: [medicion/fase3d]

permissions:
  contents: write

concurrency:
  group: medicion-fase3d
  cancel-in-progress: false

jobs:
  panel:
    name: Réplica ${{ matrix.replica }}, caché ${{ matrix.condicion }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        replica: [r1, r2]
        condicion: [fria, caliente]
        include:
          - condicion: fria
            preparacion: ""
          - condicion: caliente
            preparacion: calentar_cache.sql

    steps:
      - name: Descargar el arnés de medición
        uses: actions/checkout@v4

      - name: Descargar el código con el panel optimizado (mejora/green-dashboard)
        uses: actions/checkout@v4
        with:
          ref: mejora/green-dashboard
          path: .despues

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Ejecutar la comparación del panel
        env:
          CPUS: "1"
          MEMORIA: 2g
          XMX: 1g
          VERSIONES: despues
          VARIANTES: "F:legado:${{ matrix.preparacion }}:DASHBOARD_CONSULTAS_OPTIMIZADAS=false F:optimizado:${{ matrix.preparacion }}:DASHBOARD_CONSULTAS_OPTIMIZADAS=true"
          SIN_CONTROL: "1"
          PLAN_CARGA: medicion/escritura/PLAN_3D
          RESET_BASE: "1"
          MODO_VARIANTES: panel
          PG_SHARED_BUFFERS: 1GB
          ITER_POR_VU: "14"
          K6_NUCLEOS: "0"
        run: bash medicion/escritura/carga_escritura.sh

      - name: Guardar los resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-fase3d-${{ matrix.replica }}-${{ matrix.condicion }}
          path: resultados/
          if-no-files-found: warn

      - name: Publicar los resultados en una rama de resultados
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EJECUCION: ${{ github.run_id }}
          RAMA: medicion/resultados-fase3d-${{ matrix.replica }}-${{ matrix.condicion }}
        run: |
          set -e
          if [ ! -d resultados ]; then echo "no hay resultados que publicar"; exit 0; fi
          rm -rf /tmp/publicar && mkdir -p /tmp/publicar
          cp -r resultados /tmp/publicar/resultados
          find /tmp/publicar/resultados -name '*.log' -size +400k -exec sh -c 'tail -c 300000 "$1" > "$1.tmp" && mv "$1.tmp" "$1"' _ {} \;
          find /tmp/publicar/resultados -name '*.csv.gz' -size +20M -delete
          cd /tmp/publicar
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b "$RAMA"
          git add -A
          git commit -q -m "Resultados de la fase 3d (ejecución $EJECUCION)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$RAMA"
