name: "Medición en Render"

on:
  push:
    branches: [medicion/render]

permissions:
  contents: write

concurrency:
  group: medicion-render
  cancel-in-progress: false

jobs:
  medir:
    name: Verificar, sembrar o medir según medicion/render/FASE
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Descargar el arnés de medición
        uses: actions/checkout@v4

      - name: Descargar el ANTES (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: .antes

      - name: Descargar el DESPUÉS (medicion/despues)
        uses: actions/checkout@v4
        with:
          ref: medicion/despues
          path: .despues

      - name: Instalar k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece
        with:
          k6-version: "2.4.0"

      - name: Comprobar herramientas
        run: |
          command -v psql > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          command -v jq > /dev/null || sudo apt-get install -y -qq jq
          psql --version

      - name: Ejecutar la fase
        env:
          URL_ANTES: ${{ secrets.MEDICION_URL_ANTES }}
          URL_DESPUES: ${{ secrets.MEDICION_URL_DESPUES }}
          DB_ANTES: ${{ secrets.MEDICION_DB_ANTES }}
          DB_DESPUES: ${{ secrets.MEDICION_DB_DESPUES }}
          MEDICION_CLAVE: ${{ secrets.MEDICION_CLAVE }}
          K6_CLOUD_TOKEN: ${{ secrets.MEDICION_K6_TOKEN }}
          K6_CLOUD_STACK_ID: ${{ secrets.MEDICION_K6_STACK }}
          K6_CLOUD_PROJECT_ID: ${{ secrets.MEDICION_K6_PROJECT }}
        run: bash medicion/render/ejecutar.sh

      - name: Guardar los resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-render
          path: resultados/
          if-no-files-found: warn

      - name: Publicar los resultados en la rama medicion/resultados-render
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EJECUCION: ${{ github.run_id }}
        run: |
          set -e
          if [ ! -d resultados ]; then echo "no hay resultados que publicar"; exit 0; fi
          rm -rf /tmp/publicar && mkdir -p /tmp/publicar
          cp -r resultados /tmp/publicar/resultados
          find /tmp/publicar/resultados -name '*.log' -size +400k -exec sh -c 'tail -c 300000 "$1" > "$1.tmp" && mv "$1.tmp" "$1"' _ {} \;
          cd /tmp/publicar
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b medicion/resultados-render
          git add -A
          git commit -q -m "Resultados de la medición en Render (ejecución $EJECUCION)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" medicion/resultados-render
