name: "Fase 3e: configuración de PostgreSQL y heap (laboratorio)"

on:
  push:
    branches: [medicion/fase3e]

permissions:
  contents: write

concurrency:
  group: medicion-fase3e
  cancel-in-progress: false

jobs:
  configuracion:
    name: Réplica ${{ matrix.replica }}, código ${{ matrix.tipo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        replica: [r1, r2]
        tipo: [anterior, nuevo]
        include:
          - tipo: anterior
            variantes: "F:legado_base::DASHBOARD_CONSULTAS_OPTIMIZADAS=false F:legado_config:config_bd_plan_jit.sql:DASHBOARD_CONSULTAS_OPTIMIZADAS=false"
            plan: medicion/escritura/PLAN_3E_L
          - tipo: nuevo
            variantes: "F:opt_base::DASHBOARD_CONSULTAS_OPTIMIZADAS=true F:opt_config:config_bd_plan_jit.sql:DASHBOARD_CONSULTAS_OPTIMIZADAS=true G:opt_config_heap:config_bd_plan_jit.sql:DASHBOARD_CONSULTAS_OPTIMIZADAS=true"
            plan: medicion/escritura/PLAN_3E_N

    steps:
      - name: Descargar el arnés de medición
        uses: actions/checkout@v4

      - name: Descargar el código con el panel optimizado (mejora/green-dashboard)
        uses: actions/checkout@v4
        with:
          ref: mejora/green-dashboard
          path: .despues

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Ejecutar la comparación de configuración
        env:
          CPUS: "1"
          MEMORIA: 2g
          XMX: 1g
          VERSIONES: despues
          VARIANTES: ${{ matrix.variantes }}
          SIN_CONTROL: "1"
          PLAN_CARGA: ${{ matrix.plan }}
          RESET_BASE: "1"
          MODO_VARIANTES: multi
          PG_SHARED_BUFFERS: 1GB
          ITER_POR_VU: "14"
          K6_NUCLEOS: "0"
        run: bash medicion/escritura/carga_escritura.sh

      - name: Guardar los resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-fase3e-${{ matrix.replica }}-${{ matrix.tipo }}
          path: resultados/
          if-no-files-found: warn

      - name: Publicar los resultados en una rama de resultados
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EJECUCION: ${{ github.run_id }}
          RAMA: medicion/resultados-fase3e-${{ matrix.replica }}-${{ matrix.tipo }}
        run: |
          set -e
          if [ ! -d resultados ]; then echo "no hay resultados que publicar"; exit 0; fi
          rm -rf /tmp/publicar && mkdir -p /tmp/publicar
          cp -r resultados /tmp/publicar/resultados
          find /tmp/publicar/resultados -name '*.log' -size +400k -exec sh -c 'tail -c 300000 "$1" > "$1.tmp" && mv "$1.tmp" "$1"' _ {} \;
          find /tmp/publicar/resultados -name '*.csv.gz' -size +20M -delete
          cd /tmp/publicar
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b "$RAMA"
          git add -A
          git commit -q -m "Resultados de la fase 3e (ejecución $EJECUCION)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$RAMA"
