name: "Carga con escrituras (laboratorio)"

on:
  push:
    branches: [medicion/carga-escritura]
  workflow_dispatch:
    inputs:
      perfil:
        description: "Perfil del laboratorio. No se deben comparar resultados entre perfiles."
        type: choice
        options:
          - CAPACIDAD-2G
          - PRODUCCION-512M
        default: CAPACIDAD-2G
      umbral_generador_cpu_pct:
        description: "Umbral experimental de saturación del generador k6 (% de su CPU)"
        type: string
        default: "80"
      heap_en_vivo:
        description: "Muestreo del heap de la JVM en vivo (1 = sí, 0 = no)"
        type: choice
        options:
          - "1"
          - "0"
        default: "1"

permissions:
  contents: write

concurrency:
  group: medicion-carga-escritura
  cancel-in-progress: false

jobs:
  capacidad:
    name: Escalera de carga con lecturas y escrituras
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Descargar el arnés de medición
        uses: actions/checkout@v4

      - name: Descargar el ANTES (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: .antes

      - name: Descargar el DESPUÉS (medicion/despues)
        uses: actions/checkout@v4
        with:
          ref: medicion/despues
          path: .despues

      - name: Instalar k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece
        with:
          k6-version: "2.4.0"

      - name: Ejecutar la escalera de carga
        run: bash medicion/escritura/carga_escritura.sh

      - name: Guardar los resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-carga-escritura
          path: resultados/
          if-no-files-found: warn

      - name: Publicar los resultados en la rama medicion/resultados-carga-escritura
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EJECUCION: ${{ github.run_id }}
        run: |
          set -e
          if [ ! -d resultados ]; then echo "no hay resultados que publicar"; exit 0; fi
          rm -rf /tmp/publicar && mkdir -p /tmp/publicar
          cp -r resultados /tmp/publicar/resultados
          find /tmp/publicar/resultados -name '*.log' -size +400k -exec sh -c 'tail -c 300000 "$1" > "$1.tmp" && mv "$1.tmp" "$1"' _ {} \;
          find /tmp/publicar/resultados -name '*.csv.gz' -size +20M -delete
          cd /tmp/publicar
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b medicion/resultados-carga-escritura
          git add -A
          git commit -q -m "Resultados de la carga con escrituras (ejecución $EJECUCION)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" medicion/resultados-carga-escritura
