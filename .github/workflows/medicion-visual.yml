name: "Evidencia visual en un navegador real y cierre de la caída de la base (laboratorio)"

on:
  push:
    branches: [medicion/visual]

permissions:
  contents: read

concurrency:
  group: medicion-visual
  cancel-in-progress: false

jobs:
  corte:
    name: Corte con peticiones en curso con el código final, réplica ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        replica: [r1, r2]
    steps:
      - uses: actions/checkout@v4
      - name: Backend final (green-diagnostico-despues)
        uses: actions/checkout@v4
        with: { ref: green-diagnostico-despues, path: .despues }
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece
        with:
          k6-version: "2.4.0"
      - name: Ejecutar los cortes
        env:
          CPUS: "1"
          MEMORIA: 2g
          XMX: 1g
          VERSIONES: despues
          SIN_CONTROL: "1"
          PLAN_CARGA: medicion/escritura/PLAN_CAOS
          RESET_BASE: "0"
          MODO_CORTE: "1"
          ENV_EXTRA_BACKEND: DB_POOL_CONNECTION_TIMEOUT_MS=5000
          CICLOS_CORTE: "20"
          TRABAJADORES_CORTE: "40"
          ESPERA_CORTE_S: "12"
          PG_SHARED_BUFFERS: 1GB
          ITER_POR_VU: "40"
          K6_NUCLEOS: "0"
        run: bash medicion/escritura/carga_escritura.sh
      - name: Guardar los resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corte-final-${{ matrix.replica }}
          path: resultados/
          if-no-files-found: warn

  espera-intermedia:
    name: Espera de conexión con paradas de ${{ matrix.parada }} s, réplica ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        replica: [r1, r2]
        parada: [5, 15]
    steps:
      - uses: actions/checkout@v4
      - name: Backend final (green-diagnostico-despues)
        uses: actions/checkout@v4
        with: { ref: green-diagnostico-despues, path: .despues }
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece
        with:
          k6-version: "2.4.0"
      - name: Ejecutar las paradas con tres esperas de conexión
        env:
          CPUS: "1"
          MEMORIA: 2g
          XMX: 1g
          VERSIONES: despues
          VARIANTES: "F:caos_bd_parada_despues:::despues F:caos_bd_parada_medio::DB_POOL_CONNECTION_TIMEOUT_MS=10000:despues F:caos_bd_parada_rapido::DB_POOL_CONNECTION_TIMEOUT_MS=5000:despues"
          SIN_CONTROL: "1"
          PLAN_CARGA: medicion/escritura/PLAN_CAOS
          RESET_BASE: "1"
          MODO_VARIANTES: caos
          FASE_ETIQUETA: 3h
          ESPERA_CAOS: "150"
          PARADA_BD_S: ${{ matrix.parada }}
          ESPERA_SONDA_S: ${{ matrix.parada == 5 && '0' || '8' }}
          SONDA_INICIO_S: "2"
          PG_SHARED_BUFFERS: 1GB
          ITER_POR_VU: "40"
          K6_NUCLEOS: "0"
        run: bash medicion/escritura/carga_escritura.sh
      - name: Guardar los resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espera-${{ matrix.parada }}s-${{ matrix.replica }}
          path: resultados/
          if-no-files-found: warn
