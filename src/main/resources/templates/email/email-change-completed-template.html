<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Correo actualizado</title></head>
<body style="margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#1e293b">
<div style="max-width:600px;margin:32px auto;background:#fff;border:1px solid #dbe4ef;border-radius:12px;padding:32px">
    <h1 style="font-size:22px;margin:0 0 16px;color:#075985">Correo de acceso actualizado</h1>
    <p>Hola <strong th:text="${nombre}">usuario</strong>,</p>
    <p>El correo de acceso fue actualizado a <strong th:text="${newEmail}">nuevo@correo.com</strong>.</p>
    <p>Todas las sesiones anteriores fueron cerradas. Deberás iniciar sesión nuevamente con el correo nuevo.</p>
    <p style="font-size:13px;color:#b91c1c">Si no reconoces este cambio, contacta inmediatamente al administrador de la empresa.</p>
    <p style="font-size:12px;color:#94a3b8" th:text="${companyName}">Sistema</p>
</div>
</body>
</html>
