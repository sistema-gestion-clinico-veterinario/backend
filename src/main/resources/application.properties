spring.application.name=vargasvet
server.port=8080
server.servlet.context-path=/api/v1
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# =========================
# DATABASE
# =========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

# Bounded waits for external HTTP integrations.
http.client.connect-timeout=${HTTP_CONNECT_TIMEOUT:5s}
http.client.read-timeout=${HTTP_READ_TIMEOUT:30s}
api.pagination.max-size=${API_MAX_PAGE_SIZE:1000}
# =========================
# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# =========================
# JWT
# =========================
jwt.validity-in-seconds=1800
jwt.refresh-validity-in-seconds=604800
jwt.absolute-timeout-seconds=86400
jwt.issuer=${JWT_ISSUER:systemvet-api}
jwt.audience=${JWT_AUDIENCE:systemvet-web}
jwt.private-key=${JWT_PRIVATE_KEY:file:${user.home}/.vargasvet/keys/private_key.pem}
jwt.public-key=${JWT_PUBLIC_KEY:file:${user.home}/.vargasvet/keys/public_key.pem}

# =========================
# MAIL SMTP
# =========================
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.mail.from=${MAIL_FROM:sebastiansaavedraarroyo8@gmail.com}

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =========================
# APPLICATION
# =========================
app.url=${APP_URL:http://localhost:4200}
app.frontend.verify-url=${app.url}/auth/verify#token=
app.frontend.login-url=${app.url}/auth/login

app.company.name=Veterinaria Vargas Ver
app.company.email=soporte@patitasfelices.com

# RECORDATORIOS PREVENTIVOS - 08:00 hora de Peru
app.reminders.cron=${REMINDERS_CRON:0 0 8 * * *}
app.reminders.zone=America/Lima
app.company.phone=+51 999 888 777
app.company.address=Av. Veterinaria 123, Lima, PerÃº
app.company.logo=https://i.postimg.cc/xTJ77LFz/images.png

# =========================
# FILE STORAGE - SUPABASE
# =========================
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.bucket=${SUPABASE_BUCKET:vargasvet}


# El servicio clinico admite archivos de hasta 20 MB. La peticion permite margen
# para los metadatos multipart sin ampliar el limite efectivo del archivo.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:21MB}

# =========================
# CORS
# =========================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://systemvetfrontend.vercel.app}

# =========================
# COOKIE (HttpOnly tokens)
# =========================
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.setup.enabled=${SETUP_ENABLED:false}
app.setup.token=${SETUP_TOKEN:}
app.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:20}
app.rate-limit.refresh-per-minute=${RATE_LIMIT_REFRESH_PER_MINUTE:10}
app.rate-limit.password-reset-per-15-minutes=${RATE_LIMIT_PASSWORD_RESET_PER_15_MINUTES:5}
app.rate-limit.login-per-account-per-15-minutes=${RATE_LIMIT_LOGIN_PER_ACCOUNT_PER_15_MINUTES:8}
app.rate-limit.recovery-per-account-per-hour=${RATE_LIMIT_RECOVERY_PER_ACCOUNT_PER_HOUR:3}
app.rate-limit.realtime-ticket-per-minute=${RATE_LIMIT_REALTIME_TICKET_PER_MINUTE:10}
security.password-reset-validity-minutes=${PASSWORD_RESET_VALIDITY_MINUTES:60}
security.email-change-validity-minutes=${EMAIL_CHANGE_VALIDITY_MINUTES:30}
security.bcrypt-strength=${BCRYPT_STRENGTH:12}

# =========================
# SWAGGER / OPENAPI
# =========================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

# =========================
# LOGGING
# =========================
logging.level.org.springframework.mail=WARN
logging.level.org.springframework.security=INFO

# =========================
# OBSERVABILITY
# =========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# =========================
# MERCADOPAGO TEST
# =========================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}

# =========================
# IA MICROSERVICIO
# =========================
ia.radiografia.url=${IA_RADIOGRAFIA_URL:http://localhost:8001}
ia.laboratorio.url=${IA_LABORATORIO_URL:http://localhost:8001}

